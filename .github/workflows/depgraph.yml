name: depgraph dependency scan

on:
  workflow_dispatch:
    inputs:
      manifest-path:
        description: 'Path to manifest file'
        required: false
        default: 'package.json'
      ecosystem:
        description: 'Ecosystem (npm, pypi, cargo)'
        required: false
        default: 'npm'

jobs:
  scan:
    name: Scan dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run depgraph scan
        uses: ./packages/action
        with:
          api-url: ${{ secrets.DEPGRAPH_API_URL }}
          api-key: ${{ secrets.DEPGRAPH_API_KEY }}
          manifest-path: ${{ inputs.manifest-path }}
          ecosystem: ${{ inputs.ecosystem }}
          fail-on: block
          post-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
